<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Thư viện số nghe nhìn{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Thư viện số nghe nhìn</a>
    {% if user %}
    <nav>
      <a href="/">Tra cứu</a>
      <a href="/requests">Yêu cầu khai thác</a>
      {% if user.can('eval.view') %}<a href="/eval">Đánh giá</a>{% endif %}
      {% if user.can('user.manage') %}<a href="/admin/users">Tài khoản</a>{% endif %}
    </nav>
    <form class="whoami" method="post" action="/logout">
      <span>{{ user.full_name or user.username }}</span>
      <button type="submit" class="link">Đăng xuất</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
