<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Thư viện số nghe nhìn{% endblock %}</title>
  <link rel="preload" href="/static/fonts/newsreader-vietnamese-opsz-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/style.css{% if asset_version is defined %}?v={{ asset_version('style.css') }}{% endif %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}page{% endblock %}">
  <a class="skip-link" href="#main">Bỏ qua tới nội dung</a>
  {% include "_header.html" %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
